<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Five direct DJI Spark recovery connections</title>
  <desc id="desc">With contacts numbered left to right, connect Nano A5 to contact one, Nano ground to contact two, nothing to contact three, nine volt positive to contact four, nine volt negative to contact five and Nano A4 to contact six.</desc>
  <rect width="1100" height="650" rx="30" fill="#061321"/>
  <text x="550" y="45" fill="#ffffff" font-family="Arial,sans-serif" font-size="27" text-anchor="middle" font-weight="900">CONNECT THESE FIVE WIRES</text>
  <text x="550" y="77" fill="#9dc8e5" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Battery label facing you · contacts counted LEFT → RIGHT</text>
  <path d="M122 122 Q550 80 978 122 L1015 160 V292 H85V160Z" fill="#293f52" stroke="#86a9c0" stroke-width="5"/>
  <text x="550" y="151" fill="#dfeff8" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="800">DJI SPARK BATTERY CONNECTOR</text>
  <rect x="115" y="174" width="870" height="98" rx="12" fill="#02070b" stroke="#66869d" stroke-width="4"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="900">
    <g><rect x="137" y="190" width="98" height="66" rx="7" fill="#249ef5"/><text x="186" y="233" fill="#fff" font-size="31">1</text></g>
    <g><rect x="282" y="190" width="98" height="66" rx="7" fill="#8d9ca8"/><text x="331" y="233" fill="#fff" font-size="31">2</text></g>
    <g><rect x="427" y="190" width="98" height="66" rx="7" fill="#483d29"/><text x="476" y="233" fill="#d7c9a6" font-size="31">3</text></g>
    <g><rect x="572" y="190" width="98" height="66" rx="7" fill="#f25149"/><text x="621" y="233" fill="#fff" font-size="31">4</text></g>
    <g><rect x="717" y="190" width="98" height="66" rx="7" fill="#8d9ca8"/><text x="766" y="233" fill="#fff" font-size="31">5</text></g>
    <g><rect x="862" y="190" width="98" height="66" rx="7" fill="#25c88d"/><text x="911" y="233" fill="#fff" font-size="31">6</text></g>
  </g>
  <g fill="none" stroke-width="9" stroke-linecap="round"><path d="M186 256v98" stroke="#249ef5"/><path d="M331 256v98" stroke="#a6b3bc"/><path d="M621 256v98" stroke="#f25149"/><path d="M766 256v98" stroke="#8d9ca8"/><path d="M911 256v98" stroke="#25c88d"/></g>
  <path d="M447 313l58 58M505 313l-58 58" stroke="#f3bf4b" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="112" y="355" width="148" height="94" rx="13" fill="#0b3551" stroke="#249ef5" stroke-width="3"/><text x="186" y="391" fill="#8bd3ff" font-size="15" font-weight="800">ARDUINO NANO</text><text x="186" y="424" fill="#fff" font-size="22" font-weight="900">A5 / SCL</text></g>
    <g><rect x="257" y="355" width="148" height="94" rx="13" fill="#263542" stroke="#a6b3bc" stroke-width="3"/><text x="331" y="391" fill="#d2dce3" font-size="15" font-weight="800">ARDUINO NANO</text><text x="331" y="424" fill="#fff" font-size="22" font-weight="900">GND</text></g>
    <g><rect x="402" y="355" width="148" height="94" rx="13" fill="#352e20" stroke="#b59345" stroke-width="3"/><text x="476" y="392" fill="#f3cf7a" font-size="18" font-weight="900">NO WIRE</text><text x="476" y="421" fill="#cdbb91" font-size="14">leave empty</text></g>
    <g><rect x="547" y="355" width="148" height="94" rx="13" fill="#4a2425" stroke="#f25149" stroke-width="3"/><text x="621" y="391" fill="#ff9189" font-size="15" font-weight="800">9 V BATTERY</text><text x="621" y="424" fill="#fff" font-size="22" font-weight="900">RED  +</text></g>
    <g><rect x="692" y="355" width="148" height="94" rx="13" fill="#26313a" stroke="#a6b3bc" stroke-width="3"/><text x="766" y="391" fill="#d2dce3" font-size="15" font-weight="800">9 V BATTERY</text><text x="766" y="424" fill="#fff" font-size="22" font-weight="900">BLACK  −</text></g>
    <g><rect x="837" y="355" width="148" height="94" rx="13" fill="#123c31" stroke="#25c88d" stroke-width="3"/><text x="911" y="391" fill="#75e7bd" font-size="15" font-weight="800">ARDUINO NANO</text><text x="911" y="424" fill="#fff" font-size="22" font-weight="900">A4 / SDA</text></g>
  </g>
  <rect x="112" y="490" width="423" height="89" rx="15" fill="#0a2035" stroke="#2f6d96" stroke-width="3"/>
  <path d="M153 529h78" stroke="#d9ecf8" stroke-width="9"/><rect x="230" y="517" width="31" height="24" rx="5" fill="#d9ecf8"/><text x="294" y="526" fill="#76c9ff" font-family="Arial,sans-serif" font-size="15" font-weight="800">USB-C</text><text x="294" y="550" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="900">NANO → MAC</text>
  <rect x="565" y="490" width="423" height="89" rx="15" fill="#3b2620" stroke="#c06d4c" stroke-width="3"/>
  <path d="M611 514l39 39M650 514l-39 39" stroke="#ff8c69" stroke-width="8" stroke-linecap="round"/><text x="798" y="526" fill="#ff9d7e" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="800">DURING RECOVERY</text><text x="798" y="550" fill="#fff" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="900">DJI CHARGER DISCONNECTED</text>
  <text x="550" y="621" fill="#a9c3d6" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Check every contact twice before attaching the 9 V snap connector.</text>
</svg>
