<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">DJI Spark battery connector orientation</title>
  <desc id="desc">Hold the battery upright with the LEDs and button on top, label facing you and connector contacts facing you. Number contacts one through six from left to right.</desc>
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#40586c"/><stop offset="1" stop-color="#172838"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="570" rx="28" fill="#061321"/>
  <text x="500" y="43" fill="#ffffff" font-family="Arial,sans-serif" font-size="25" text-anchor="middle" font-weight="800">HOLD THE BATTERY THIS WAY</text>
  <text x="500" y="73" fill="#82caff" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700">LEDs and button UP · label and contacts FACING YOU</text>
  <path d="M286 123 Q500 73 714 123 L760 169 V493 H240 V169Z" fill="url(#case)" stroke="#8bb0c8" stroke-width="5"/>
  <path d="M315 130 Q500 95 685 130" fill="none" stroke="#b5cfdf" stroke-width="4"/>
  <circle cx="382" cy="143" r="9" fill="#36d99b" filter="url(#glow)"/><circle cx="427" cy="143" r="9" fill="#36d99b" filter="url(#glow)"/><circle cx="472" cy="143" r="9" fill="#263d50"/><circle cx="517" cy="143" r="9" fill="#263d50"/><circle cx="617" cy="143" r="18" fill="#9ab0bf" stroke="#d7e5ec" stroke-width="3"/>
  <path d="M500 86v34" stroke="#82caff" stroke-width="4"/><path d="M490 110l10 12 10-12" fill="none" stroke="#82caff" stroke-width="4"/>
  <text x="500" y="217" fill="#d9ecf8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="800">COUNT LEFT → RIGHT</text>
  <rect x="280" y="238" width="440" height="118" rx="13" fill="#02070b" stroke="#7596ad" stroke-width="4"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="900">
    <g><rect x="296" y="254" width="58" height="86" rx="7" fill="#249ef5"/><text x="325" y="304" fill="#fff" font-size="35">1</text><text x="325" y="390" fill="#69c6ff" font-size="17">SCL</text></g>
    <g><rect x="366" y="254" width="58" height="86" rx="7" fill="#8d9ca8"/><text x="395" y="304" fill="#fff" font-size="35">2</text><text x="395" y="390" fill="#d1dae1" font-size="17">GND</text></g>
    <g><rect x="436" y="254" width="58" height="86" rx="7" fill="#6b5426"/><text x="465" y="304" fill="#fff" font-size="35">3</text><text x="465" y="390" fill="#c7a85d" font-size="15">PACK+</text></g>
    <g><rect x="506" y="254" width="58" height="86" rx="7" fill="#f25149"/><text x="535" y="304" fill="#fff" font-size="35">4</text><text x="535" y="390" fill="#ff9189" font-size="15">PACK+</text></g>
    <g><rect x="576" y="254" width="58" height="86" rx="7" fill="#8d9ca8"/><text x="605" y="304" fill="#fff" font-size="35">5</text><text x="605" y="390" fill="#d1dae1" font-size="17">GND</text></g>
    <g><rect x="646" y="254" width="58" height="86" rx="7" fill="#25c88d"/><text x="675" y="304" fill="#fff" font-size="35">6</text><text x="675" y="390" fill="#75e7bd" font-size="17">SDA</text></g>
  </g>
  <rect x="326" y="420" width="348" height="43" rx="8" fill="#0a1722" stroke="#58748a" stroke-width="2"/>
  <text x="500" y="448" fill="#f3f8fb" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="800">BATTERY LABEL FACING YOU</text>
  <text x="500" y="536" fill="#a9c3d6" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Never count from the rear of the battery.</text>
</svg>
