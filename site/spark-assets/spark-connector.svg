<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">DJI Spark battery connector orientation</title>
  <desc id="desc">Battery shown label toward operator, LEDs up, six contacts numbered left to right.</desc>
  <defs><linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#33475a"/><stop offset="1" stop-color="#172635"/></linearGradient></defs>
  <rect width="640" height="420" rx="26" fill="#071321"/>
  <text x="320" y="34" fill="#8dc8f4" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700">LEDs + BUTTON UP</text>
  <path d="M188 75 Q320 36 452 75 L492 118 V348 H148 V118Z" fill="url(#case)" stroke="#7190a6" stroke-width="4"/>
  <rect x="205" y="98" width="230" height="24" rx="12" fill="#0b1722"/>
  <circle cx="250" cy="110" r="5" fill="#35d99b"/><circle cx="285" cy="110" r="5" fill="#35d99b"/><circle cx="320" cy="110" r="5" fill="#203445"/><circle cx="355" cy="110" r="5" fill="#203445"/><circle cx="400" cy="110" r="8" fill="#738b9e"/>
  <rect x="196" y="158" width="248" height="92" rx="9" fill="#050b10" stroke="#526b80" stroke-width="3"/>
  <g font-family="Arial,sans-serif" font-weight="800" text-anchor="middle">
    <g fill="#34aaff"><rect x="207" y="173" width="32" height="62" rx="5"/><text x="223" y="276" font-size="20">1</text><text x="223" y="300" font-size="13">SCL</text></g>
    <g fill="#8796a5"><rect x="246" y="173" width="32" height="62" rx="5"/><text x="262" y="276" font-size="20">2</text><text x="262" y="300" font-size="13">GND</text></g>
    <g fill="#f3bf4b"><rect x="285" y="173" width="32" height="62" rx="5"/><text x="301" y="276" font-size="20">3</text><text x="301" y="300" font-size="13">PACK+</text></g>
    <g fill="#ff594f"><rect x="324" y="173" width="32" height="62" rx="5"/><text x="340" y="276" font-size="20">4</text><text x="340" y="300" font-size="13">PACK+</text></g>
    <g fill="#8796a5"><rect x="363" y="173" width="32" height="62" rx="5"/><text x="379" y="276" font-size="20">5</text><text x="379" y="300" font-size="13">GND</text></g>
    <g fill="#36d99b"><rect x="402" y="173" width="32" height="62" rx="5"/><text x="418" y="276" font-size="20">6</text><text x="418" y="300" font-size="13">SDA</text></g>
  </g>
  <rect x="208" y="320" width="224" height="18" rx="4" fill="#0b1722"/><text x="320" y="374" fill="#b7cad9" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">LABEL FACING YOU</text>
</svg>
