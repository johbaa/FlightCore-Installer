name: Sync official FlightCore product logo

on:
  push:
    paths:
      - '.github/workflows/sync-official-flightcore-logo.yml'

permissions:
  contents: write

jobs:
  sync-logo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact FlightCore RC11 product payload
        run: |
          set -Eeuo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/johbaa/SIYI_PI_Installer/main/FLIGHTCORE_RPI_INSTALLER_RELEASE_4.4.0-rc.11.tar.gz \
            -o /tmp/flightcore.tar.gz
          mkdir -p /tmp/flightcore-payload
          tar -xzf /tmp/flightcore.tar.gz -C /tmp/flightcore-payload

      - name: Select exact shield-and-wings FlightCore wordmark
        id: logo
        run: |
          set -Eeuo pipefail
          TARGET_SHA='c5d97835b9a9aa36a7592a652b08f645ac4f218153966f51ac2743ee58a243c7'
          SRC=''
          while IFS= read -r -d '' f; do
            h="$(sha256sum "$f" | awk '{print $1}')"
            if [ "$h" = "$TARGET_SHA" ]; then
              SRC="$f"
              break
            fi
          done < <(find /tmp/flightcore-payload -type f -print0)

          if [ -z "$SRC" ]; then
            echo "Exact shield-and-wings FlightCore logo SHA-256 was not found in RC11 payload." >&2
            echo "PNG candidates:" >&2
            find /tmp/flightcore-payload -type f -iname '*.png' -exec file {} \; >&2 || true
            exit 2
          fi

          echo "Selected exact FlightCore product logo: $SRC"
          echo "SHA-256: $(sha256sum "$SRC" | awk '{print $1}')"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      - name: Replace wrong F header asset with official FlightCore product logo
        run: |
          set -Eeuo pipefail
          cp '${{ steps.logo.outputs.src }}' site/flightcore-official-logo.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="flightcore-official-logo.png"', 'href="flightcore-official-logo.png?v=shield1"')
          s = s.replace('src="flightcore-official-logo.png"', 'src="flightcore-official-logo.png?v=shield1"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit corrected official branding
        run: |
          set -Eeuo pipefail
          test "$(sha256sum site/flightcore-official-logo.png | awk '{print $1}')" = 'c5d97835b9a9aa36a7592a652b08f645ac4f218153966f51ac2743ee58a243c7'
          git config user.name 'FlightCore Build'
          git config user.email 'actions@users.noreply.github.com'
          git add site/index.html site/flightcore-official-logo.png
          if git diff --cached --quiet; then
            echo 'Official shield-and-wings logo already installed.'
            exit 0
          fi
          git commit -m 'Use shield-and-wings FlightCore product logo on installer site'
          git push origin HEAD:main
