name: Sync official FlightCore product logo

on:
  push:
    paths:
      - '.github/workflows/sync-official-flightcore-logo.yml'
      - 'site/flightcore-shield-wordmark.b64'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-branding:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble corrected FlightCore install site
        run: |
          set -Eeuo pipefail
          rm -rf _site
          mkdir -p _site/downloads
          cp -R site/. _site/

          # Replace the incorrect installer-F header asset with the exact
          # FlightCore shield-and-wings wordmark supplied for the product UI.
          base64 -d site/flightcore-shield-wordmark.b64 > _site/flightcore-official-logo.png
          test "$(sha256sum _site/flightcore-official-logo.png | awk '{print $1}')" = \
            '3e8b1f095e86ad0be1abfc44eb0c5045d3dd9f9aa7827efdbf5e67c19665c6e1'

          # Force browsers/CDNs to fetch the corrected brand asset.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'flightcore-official-logo\.png(?:\?v=[^"\']+)?',
                   'flightcore-official-logo.png?v=shield2',s)
          p.write_text(s,encoding='utf-8')
          PY

          # Preserve the exact already-published installers and manifest.
          curl -fL --retry 4 \
            https://johbaa.github.io/FlightCore-Installer/downloads/FlightCore-Installer-mac-universal.dmg \
            -o _site/downloads/FlightCore-Installer-mac-universal.dmg
          curl -fL --retry 4 \
            https://johbaa.github.io/FlightCore-Installer/downloads/FlightCore-Installer-win-x64.exe \
            -o _site/downloads/FlightCore-Installer-win-x64.exe
          curl -fL --retry 4 \
            https://johbaa.github.io/FlightCore-Installer/installer-manifest.json \
            -o _site/installer-manifest.json

          rm -f _site/flightcore-shield-wordmark.b64 _site/release.json
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy corrected install site
        id: deployment
        uses: actions/deploy-pages@v4
