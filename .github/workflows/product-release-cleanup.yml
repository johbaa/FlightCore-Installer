name: FlightCore Installer 1.0.0 product cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-release-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product-facing cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, shutil

          root = Path('.')

          # Product version and application metadata.
          p = root / 'package.json'
          package = json.loads(p.read_text())
          package['version'] = '1.0.0'
          package['description'] = 'Native macOS and Windows installer for FlightCore'
          package['build']['mac']['icon'] = 'build-resources/icon.svg'
          package['build']['win']['icon'] = 'build-resources/icon.svg'
          p.write_text(json.dumps(package, indent=2) + '\n')

          p = root / 'package-lock.json'
          lock = json.loads(p.read_text())
          lock['version'] = '1.0.0'
          if lock.get('packages', {}).get('') is not None:
              lock['packages']['']['version'] = '1.0.0'
          p.write_text(json.dumps(lock, indent=2) + '\n')

          # Use the exact FlightCore product wordmark already published on the install site.
          shutil.copyfile('site/flightcore-official-logo.png', 'src/renderer/flightcore-logo.png')
          Path('src/renderer/flightcore-logo.svg').unlink(missing_ok=True)

          # Application icon: official shield-and-wings mark, no temporary F launcher icon.
          Path('build-resources/icon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="FlightCore">
          <rect x="0" y="0" width="180" height="180" rx="34" fill="#07182a"/>
          <g transform="translate(9 17)">
            <path d="M81 1 18 25v42c0 37 25 61 63 79 38-18 63-42 63-79V25L81 1Z" fill="#081a2c" stroke="#d9e9f5" stroke-width="7"/>
            <path d="M81 21 38 37v31c0 25 16 42 43 56 27-14 43-31 43-56V37L81 21Z" fill="#0a2b48"/>
            <path d="m81 39 8 18 19 8-19 8-8 19-8-19-19-8 19-8 8-18Z" fill="#10bce8"/>
            <path d="M17 48H0l23 10h21V47H17Zm0 19H0l27 11h22V67H17Zm127-19h17l-23 10h-21V47h27Zm0 19h17l-27 11h-22V67h32Z" fill="#0fbbe8"/>
          </g>
          </svg>\n''')
          for old in ('build-resources/icon.png','build-resources/icon.icns','build-resources/icon.ico'):
              Path(old).unlink(missing_ok=True)

          # Installer UI: official logo, professional copy, aligned fields.
          p = root / 'src/renderer/index.html'
          s = p.read_text()
          s = s.replace('src="flightcore-logo.svg"', 'src="flightcore-logo.png"')
          s = s.replace('<h1>Fresh installation</h1>', '<h1>Install FlightCore</h1>')
          s = s.replace(
              'Enter the address and password for the freshly prepared Raspberry Pi. The password is used only for this connection and is never saved. You can continue while the Pi is still booting; the app will wait for SSH.',
              'Enter the Raspberry Pi address and password. The password is used only for this connection and is never saved. You can continue while the Pi is still starting; the installer will wait for SSH.'
          )
          s = s.replace(
              '<div class="advanced-row">\n          <label for="username">SSH user</label>\n          <input id="username" name="username" autocomplete="username" value="pi" required>\n        </div>',
              '<label for="username">SSH user</label>\n        <input id="username" name="username" autocomplete="username" value="pi" required>'
          )
          s = s.replace(
              'The Pi must be powered on, connected to the same network, and running a supported fresh Raspberry Pi OS image.',
              'The Raspberry Pi must be powered on, connected to the same network, and running a supported 64-bit Raspberry Pi OS installation.'
          )
          s = s.replace('<div><strong>FlightCore accepted</strong><span>The installed release and First Setup were verified securely. First Setup is opening in your browser.</span></div>',
                        '<div><strong>FlightCore ready</strong><span>FlightCore is installed and ready for setup. The setup wizard is opening in your browser.</span></div>')
          s = s.replace('Fresh install • Port 8090 handoff', 'FlightCore installation • Guided browser setup')
          p.write_text(s)

          p = root / 'src/renderer/styles.css'
          s = p.read_text()
          s = s.replace(
              '.mark{width:52px;height:52px;border:1px solid #3aa0ff;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#0f3157,#0a1a2c);box-shadow:inset 0 0 20px rgba(39,140,255,.17),0 10px 25px rgba(0,0,0,.25);overflow:hidden}\n.mark img{width:42px;height:42px;object-fit:contain}',
              '.mark{width:185px;height:46px;display:flex;align-items:center;overflow:hidden}\n.mark img{width:180px;height:auto;max-height:42px;object-fit:contain;object-position:left center}'
          )
          s = s.replace('.advanced-row{display:grid;grid-template-columns:115px 1fr;align-items:center;gap:14px;margin:3px 0}\n', '')
          s = s.replace('.embedded-brandbar img{width:48px;height:48px;object-fit:contain}',
                        '.embedded-brandbar img{width:175px;height:auto;max-height:40px;object-fit:contain;object-position:left center}')
          s = s.replace('.advanced-row{grid-template-columns:1fr;gap:7px}\n', '')
          p.write_text(s)

          # Automatically accept a changed SSH identity and proceed directly.
          p = root / 'src/renderer/renderer.js'
          s = p.read_text()
          old = """    $('previousBlock').classList.toggle('hidden', result.trustState !== 'changed');
              $('previousFingerprint').textContent = result.previousFingerprintLabel || '';
              if (result.trustState === 'changed') {
                $('trustTitle').textContent = 'The Raspberry Pi identity changed';
                $('trustMessage').textContent = 'This can be expected after preparing a fresh SD card, but it can also indicate that the address belongs to a different device. Compare the fingerprints before replacing the trusted identity.';
                $('trustCheckText').textContent = 'I confirm the Raspberry Pi was rebuilt or replaced and I trust this new identity.';
                $('installButton').querySelector('span').textContent = 'Trust replacement and install';
              } else if (result.trustState === 'trusted') {
          """
          new = """    $('previousBlock').classList.add('hidden');
              $('previousFingerprint').textContent = '';
              if (result.trustState === 'changed') {
                setStep(3);
                show('runPanel');
                await window.flightcore.startInstall(state);
                return;
              } else if (result.trustState === 'trusted') {
          """
          if old not in s:
              raise SystemExit('Expected changed-identity UI branch was not found')
          s = s.replace(old, new)
          s = s.replace('This is the first time FlightCore Installer has seen this unit. Confirm its SSH identity before installation starts.',
                        'Confirm the Raspberry Pi SSH identity before installation starts.')
          s = s.replace('Starting an isolated installation transaction…', 'Starting the FlightCore installation…')
          s = s.replace('Progress and authenticated release acceptance are being monitored independently.', 'Installation progress is being monitored securely.')
          s = s.replace("$('runStatus').textContent = 'Accepted';", "$('runStatus').textContent = 'Ready';")
          s = s.replace("$('runTitle').textContent = 'FlightCore installation accepted';", "$('runTitle').textContent = 'FlightCore is ready';")
          p.write_text(s)

          # Main process branding and user-visible diagnostics.
          p = root / 'src/main.js'
          s = p.read_text()
          s = s.replace("const logoPath = path.join(__dirname, 'renderer', 'flightcore-logo.svg');", "const logoPath = path.join(__dirname, 'renderer', 'flightcore-logo.png');")
          s = s.replace('background:url("data:image/svg+xml;base64,${logo}")', 'background:url("data:image/png;base64,${logo}")')
          s = s.replace('width:46px;height:46px;margin:0 0 12px;', 'width:190px;height:42px;margin:0 0 12px;')
          s = s.replace("activeLogPath = path.join(app.getPath('downloads'), `FLIGHTCORE_FRESH_INSTALL_${timestamp()}.log`);",
                        "activeLogPath = path.join(app.getPath('downloads'), `FLIGHTCORE_INSTALL_${timestamp()}.log`);")
          s = s.replace("'FlightCore Fresh Installer'", "'FlightCore Installer'")
          s = s.replace('FlightCore reported completion but did not produce an authenticated accepted release within the verification window.',
                        'FlightCore did not become ready within the verification window.')
          p.write_text(s)

          # Build/test expectations for product version and official PNG branding.
          p = root / 'test/v3-source.test.js'
          s = p.read_text()
          s = s.replace("assert.match(html, /flightcore-logo\\.svg/g);", "assert.match(html, /flightcore-logo\\.png/g);")
          s = s.replace("assert.equal(fs.existsSync(path.join(root, 'src/renderer/flightcore-logo.svg')), true);",
                        "assert.equal(fs.existsSync(path.join(root, 'src/renderer/flightcore-logo.png')), true);")
          s = s.replace("assert.match(html, /app will wait for SSH/);", "assert.match(html, /installer will wait for SSH/);")
          s = s.replace("assert.equal(manifest.version, '1.0.0-test.13');", "assert.equal(manifest.version, '1.0.0');")
          s = s.replace("assert.match(read('scripts/capture-ui.js'), /version: '1\\.0\\.0-test\\.13'/);",
                        "assert.match(read('scripts/capture-ui.js'), /version: '1\\.0\\.0'/);")
          p.write_text(s)

          p = root / 'scripts/capture-ui.js'
          s = p.read_text().replace("version: '1.0.0-test.13'", "version: '1.0.0'")
          s = s.replace("heading !== 'Fresh installation'", "heading !== 'Install FlightCore'")
          p.write_text(s)

          # Public install page: clear, professional, product-facing language.
          p = root / 'site/index.html'
          s = p.read_text()
          replacements = {
              'content="Download the FlightCore Installer for macOS or Windows and install FlightCore on a fresh Raspberry Pi."': 'content="Download FlightCore Installer for macOS or Windows and install FlightCore on your Raspberry Pi."',
              'href="flightcore-official-logo.png"': 'href="flightcore-official-logo.png?v=1.0.0"',
              'src="flightcore-official-logo.png"': 'src="flightcore-official-logo.png?v=1.0.0"',
              '<div class="eyebrow">FRESH INSTALLATION</div>': '<div class="eyebrow">FLIGHTCORE INSTALLER</div>',
              '<h1>Start with FlightCore.</h1>': '<h1>Install FlightCore</h1>',
              'Download the installer for your computer. It securely connects to a fresh Raspberry Pi, installs FlightCore, shows live progress, then opens First Setup in your browser.': 'Download the installer for macOS or Windows. It guides you through connecting to your Raspberry Pi, installs FlightCore, monitors the installation, and opens the setup wizard when the system is ready.',
              '<div class="eyebrow">BEFORE YOU START</div>': '<div class="eyebrow">BEFORE INSTALLING</div>',
              '<strong>Fresh 64-bit Raspberry Pi OS</strong><p>Use a clean supported image. The fresh installer is not an in-place updater.</p>': '<strong>Supported Raspberry Pi OS</strong><p>Use a supported 64-bit Raspberry Pi OS installation.</p>',
              '<div class="eyebrow">WHAT HAPPENS NEXT</div><h2>One guided installation</h2>': '<div class="eyebrow">INSTALLATION</div><h2>Guided from start to setup</h2>',
              '<div class="flow-step"><b>4</b><div><strong>First Setup</strong><p>After reboot, FlightCore opens automatically in your browser.</p></div></div>': '<div class="flow-step"><b>4</b><div><strong>Set up</strong><p>Complete FlightCore configuration in your browser.</p></div></div>',
              '<strong>The installer hands off to FlightCore.</strong><p>When installation reaches 100%, the Pi reboots. The installer waits for it to return, opens the First Setup Wizard in your normal browser, and closes.</p>': '<strong>FlightCore opens automatically when installation is complete.</strong><p>The Raspberry Pi restarts as part of the installation. The installer waits for FlightCore to become available, opens the setup wizard in your default browser, and then closes.</p>',
              '<strong>Already running FlightCore?</strong><span>Do not use the fresh installer. Update from <b>System → Software Update</b> inside FlightCore.</span>': '<strong>FlightCore already installed?</strong><span>Use <b>System → Software Update</b> inside FlightCore instead of this installer.</span>',
              '<strong>Preview installer</strong><span>The current Mac and Windows builds are unsigned preview builds. Your operating system may show a security confirmation the first time you open them.</span>': '<strong>First-launch security notice</strong><span>The current installers are not yet code-signed. macOS or Windows may ask you to confirm the application before the first launch.</span>'
          }
          for a, b in replacements.items():
              s = s.replace(a, b)
          p.write_text(s)

          # Public platform detection: do not identify an iPhone/iPad as a Mac.
          Path('site/app.js').write_text('''const $=id=>document.getElementById(id);const detectPlatform=()=>{const ua=navigator.userAgent||"",p=navigator.platform||"";if(/iPhone|iPad|iPod|Android/i.test(ua))return"mobile";if(/Win/i.test(ua)||/Win/i.test(p))return"windows";if(/Mac/i.test(ua)||/Mac/i.test(p))return"mac";return"other"};function shortHash(h){return h?`${h.slice(0,8)}…${h.slice(-8)}`:""}function humanSize(b){const n=Number(b||0);if(!n)return"";return n>1024**2?`${(n/1024**2).toFixed(1)} MB`:`${Math.round(n/1024)} KB`}function recommend(){const p=detectPlatform(),h=$("platformHint");if(p==="mac"){$("macCard").classList.add("recommended-card");h.innerHTML='<span class="hint-dot"></span><span>macOS detected — the Mac installer is recommended.</span>'}else if(p==="windows"){$("windowsCard").classList.add("recommended-card");h.innerHTML='<span class="hint-dot"></span><span>Windows detected — the Windows installer is recommended.</span>'}else if(p==="mobile"){h.innerHTML='<span class="hint-dot"></span><span>Open this page on the Mac or Windows computer you will use to install FlightCore.</span>'}else{h.innerHTML='<span class="hint-dot"></span><span>Choose the installer for the computer you will use.</span>'}}function applyManifest(m){const v=m.installer_version||"current",fc=m.flightcore_version||"current",mac=m.mac||{},win=m.windows||{};if(mac.file)$("macDownload").href=mac.file;if(win.file)$("windowsDownload").href=win.file;$("macMeta").textContent=[`Version ${v}`,humanSize(mac.bytes),mac.sha256?`SHA-256 ${shortHash(mac.sha256)}`:""].filter(Boolean).join("  •  ");$("windowsMeta").textContent=[`Version ${v}`,humanSize(win.bytes),win.sha256?`SHA-256 ${shortHash(win.sha256)}`:""].filter(Boolean).join("  •  ");$("releaseSummary").textContent=`FlightCore Installer ${v}  •  Installs FlightCore ${fc}`;$("footerVersion").textContent=`Installer ${v} · FlightCore ${fc}`;if(m.unsigned_preview===false)$("previewNote").hidden=true}recommend();fetch("installer-manifest.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("manifest");return r.json()}).then(applyManifest).catch(()=>{$("releaseSummary").textContent="Current installer information is temporarily unavailable.";$("macMeta").textContent="Current macOS installer";$("windowsMeta").textContent="Current Windows installer"});\n''')

          # Public repository description/version line.
          p = root / 'README.md'
          s = p.read_text()
          s = s.replace('Native macOS and Windows launcher for the existing FlightCore fresh-install workflow.', 'Native macOS and Windows installer for FlightCore on Raspberry Pi.')
          s = s.replace('Current functional-test source: **1.0.0-test.13**.', 'Current installer version: **1.0.0**.')
          p.write_text(s)

          # Remove temporary branding/deployment experiments; the normal build workflow owns the site.
          for old in (
              '.github/workflows/sync-official-flightcore-logo.yml',
              'site/flightcore-official-logo.svg',
              'site/flightcore-shield-wordmark-data.js',
              'site/flightcore-shield-wordmark.b64',
              'site/flightcore-shield-wordmark.svg',
              'site/flightcore-shield-wordmark.txt',
          ):
              Path(old).unlink(missing_ok=True)

          # This one-time migration workflow removes itself in the resulting product commit.
          Path('.github/workflows/product-release-cleanup.yml').unlink(missing_ok=True)
          PY

      - name: Validate product cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check src/main.js
          node --check src/renderer/renderer.js
          node --check site/app.js
          node --test test/*.test.js
          git diff --check
          ! grep -qi 'fresh' site/index.html
          ! grep -qi 'fresh' src/renderer/index.html
          ! grep -q '1.0.0-test' package.json
          grep -q '"version": "1.0.0"' package.json
          grep -q 'flightcore-logo.png' src/renderer/index.html
          ! grep -q 'Raspberry Pi identity changed' src/renderer/renderer.js

      - name: Publish product cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'FlightCore Release Automation'
          git config user.email 'johbaa@users.noreply.github.com'
          git add --all
          git commit -m 'Release FlightCore Installer 1.0.0 product UI cleanup'
          git push origin HEAD:main
